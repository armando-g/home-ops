[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"

[hooks]
postinstall = "lefthook install"

[tools]
"github:home-operations/flate" = "v0.8.0"
"github:mitsuhiko/minijinja" = "3.1.0"
"actionlint" = "1.7.12"
"flux2" = "2.10.1"
"helm" = "4.3.2"
talosctl = "1.14.6"
"kustomize" = "5.8.3"
"kubectl" = "1.37.3"
"helmfile" = "1.8.6"
"jq" = "1.8.2"
"yq" = "4.54.3"
"bitwarden-secrets-manager" = "2.1.0"
"rust" = "1.100.1"
"cargo:just-lsp" = "0.11.2"
oxfmt = "0.78.0"
lefthook = "2.2.4"
shellcheck = "0.11.0"
"k9s" = "0.51.0"
node = "26.13.1"
just = "1.59.0"
