---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notifiarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: notifiarr-secret
    template:
      data:
        DN_API_KEY: "{{ .DN_API_KEY }}"

        DN_PROWLARR_0_NAME: "Prowlarr"
        DN_PROWLARR_0_URL: "http://prowlarr"
        DN_PROWLARR_0_API_KEY: "{{ .PROWLARR_API_KEY }}"

        DN_RADARR_0_NAME: "Radarr"
        DN_RADARR_0_URL: "http://radarr"
        DN_RADARR_0_API_KEY: "{{ .RADARR_API_KEY }}"

        DN_SONARR_0_NAME: "Sonarr"
        DN_SONARR_0_URL: "http://sonarr"
        DN_SONARR_0_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: NOTIFIARR
    - extract:
        key: RADARR
    - extract:
        key: SONARR
    - extract:
        key: PROWLARR
